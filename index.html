<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveGPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
        }

        /* Glassmorphism Container */
        .chat-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        /* Chat Bubbles */
        .msg-bot {
            background-color: #fce7f3; /* pink-100 */
            color: #9d174d; /* pink-800 */
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            background-color: #ffffff;
            color: #374151; /* gray-700 */
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-left: auto; /* Align right */
        }

        /* Typing Indicator Animation */
        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
            background-color: #db2777; /* pink-600 */
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Custom Scrollbar */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-0 md:p-4">

    <div class="chat-container w-full h-full md:max-w-md md:h-[650px] md:rounded-3xl flex flex-col overflow-hidden relative z-10 shadow-none md:shadow-2xl">
        
        <!-- Header -->
        <div class="bg-white/90 p-4 border-b border-pink-100 flex items-center gap-3 shadow-sm z-20">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-gray-800 text-lg">LoveGPT 4.0</h1>
                <p class="text-xs text-green-500 font-medium flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-500 block"></span> Online
                </p>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-white/50 relative">
            <!-- Messages will be injected here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white/90 border-t border-pink-100">
            <form id="chat-form" class="flex gap-2 relative">
                <input type="text" id="user-input" 
                    class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-full focus:ring-pink-500 focus:border-pink-500 block p-3.5 pl-5 outline-none transition-all shadow-inner" 
                    placeholder="Type a message..." autocomplete="off">
                <button type="submit" 
                    class="bg-pink-500 hover:bg-pink-600 text-white rounded-full p-3 shadow-lg transition-transform active:scale-95 flex items-center justify-center w-12 h-12 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const TARGET_NAME = "keerthi"; // Lowercase for comparison
        const SUCCESS_MESSAGE = "Keerthi, from the moment I met you, my world became brighter. You are my favorite notification and my happiest thought. Will you be my Valentine? 🌹";
        const REJECT_MESSAGE = "I'm sorry, my romantic protocols are encrypted. I can only unlock for a specific person. Access Denied. 🔒";

        // --- State Management ---
        let step = 0; // 0 = Ask Name, 1 = Check Name, 2 = Finished
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        // --- Initialization ---
        window.onload = () => {
            // Initial Bot Message
            setTimeout(() => {
                addBotMessage("Hai");
                
                // Follow up to ask name
                setTimeout(() => {
                    showTypingIndicator();
                    setTimeout(() => {
                        removeTypingIndicator();
                        addBotMessage("I am LoveGPT. Before we begin, may I know your name?");
                    }, 1000);
                }, 800);
            }, 600);
        };

        // --- Event Listeners ---
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add User Message
            addUserMessage(text);
            userInput.value = '';

            // 2. Bot Process (with delay for realism)
            showTypingIndicator();
            
            setTimeout(() => {
                removeTypingIndicator();
                processResponse(text);
            }, 1500); // 1.5s delay to simulate "thinking"
        });

        // --- Core Logic ---
        function processResponse(text) {
            const cleanText = text.toLowerCase();

            if (step === 0) {
                // User provided name
                if (cleanText.includes(TARGET_NAME)) {
                    // Success Path
                    addBotMessage("Identity Verified: Welcome, Keerthi. ❤️");
                    
                    // Add a second message with the quote after a short pause
                    showTypingIndicator();
                    setTimeout(() => {
                        removeTypingIndicator();
                        addBotMessage(SUCCESS_MESSAGE);
                        triggerHeartConfetti();
                        step = 2; // End state
                    }, 2000);

                } else {
                    // Fail Path
                    addBotMessage(REJECT_MESSAGE);
                    // Reset to ask again? Or stay locked? Let's ask again.
                    setTimeout(() => {
                        addBotMessage("Please try again. What is your name?");
                    }, 2000);
                }
            } else if (step === 2) {
                // Post-success chat (Optional: Generic love bot responses)
                const romanticReplies = [
                    "You've made this AI very happy. 🥰",
                    "Should I play some romantic music?",
                    "Sending virtual hugs! 🤗",
                    "Love is in the air (and in the code).",
                    "💖💖💖"
                ];
                const randomReply = romanticReplies[Math.floor(Math.random() * romanticReplies.length)];
                addBotMessage(randomReply);
                triggerHeartConfetti();
            }
        }

        // --- UI Functions ---
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex w-full mt-2 space-x-3 max-w-xs ml-auto justify-end';
            div.innerHTML = `
                <div>
                    <div class="msg-user p-3 rounded-l-lg rounded-br-lg">
                        <p class="text-sm">${escapeHtml(text)}</p>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function addBotMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex w-full mt-2 space-x-3 max-w-xs';
            div.innerHTML = `
                <div class="flex-shrink-0 h-8 w-8 rounded-full bg-pink-500 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div>
                    <div class="msg-bot p-3 rounded-r-lg rounded-bl-lg">
                        <p class="text-sm leading-relaxed">${text}</p>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'flex w-full mt-2 space-x-3 max-w-xs';
            div.innerHTML = `
                <div class="flex-shrink-0 h-8 w-8 rounded-full bg-pink-500 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div>
                    <div class="msg-bot p-4 rounded-r-lg rounded-bl-lg flex items-center gap-1 h-full">
                        <div class="typing-dot w-2 h-2 rounded-full"></div>
                        <div class="typing-dot w-2 h-2 rounded-full"></div>
                        <div class="typing-dot w-2 h-2 rounded-full"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function triggerHeartConfetti() {
            var defaults = {
                spread: 360,
                ticks: 50,
                gravity: 0,
                decay: 0.94,
                startVelocity: 30,
                shapes: ['heart'],
                colors: ['#FFC0CB', '#FF69B4', '#FF1493', '#C71585']
            };

            confetti({
                ...defaults,
                particleCount: 40,
                scalar: 2
            });

            confetti({
                ...defaults,
                particleCount: 10,
                scalar: 2
            });
        }
    </script>
</body>
</html>
